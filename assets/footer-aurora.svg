<svg viewBox="0 0 900 140" width="100%" height="140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="45%" stop-color="#0a0c1e"/>
      <stop offset="100%" stop-color="#14092b"/>
    </linearGradient>

    <linearGradient id="footerNeonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dfd8">
        <animate attributeName="stop-color" values="#00dfd8;#ff0080;#7928ca;#00dfd8" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#7928ca;#00dfd8;#ff0080" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00dfd8">
        <animate attributeName="stop-color" values="#7928ca;#00dfd8;#ff0080;#7928ca" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="footerLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff0080" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="footerDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#00dfd8" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base Box -->
  <rect x="2" y="2" width="896" height="136" rx="16" fill="url(#footerBgGrad)"/>
  <rect x="2" y="2" width="896" height="136" rx="16" fill="url(#footerDots)"/>

  <!-- Top Glowing Edge -->
  <line x1="2" y1="2" x2="898" y2="2" stroke="url(#footerNeonGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <!-- Laser Sweep -->
  <line x1="-250" y1="2" x2="0" y2="2" stroke="url(#footerLaser)" stroke-width="3">
    <animate attributeName="x1" from="-350" to="900" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="-100" to="1150" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- Inspiring Author Quote -->
  <text x="450" y="48" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', -apple-system, Roboto, sans-serif" font-size="13.5" font-style="italic" letter-spacing="1">
    "The best way to predict the future is to invent it." — Alan Kay
  </text>

  <!-- Closing Appreciation -->
  <text x="450" y="78" text-anchor="middle" fill="#94a3b8" font-family="'Inter', -apple-system, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    ✦ THANK YOU FOR EXPLORING MY REPOSITORY • LET'S BUILD THE FUTURE TOGETHER ✦
  </text>

  <!-- Signature Badge -->
  <g transform="translate(450, 110)" text-anchor="middle" font-family="'Inter', -apple-system, Roboto, sans-serif">
    <text x="0" y="0" fill="url(#footerNeonGrad)" font-size="13" font-weight="800" letter-spacing="3">
      PRASANTH P • @JosephPrasa • 2026
    </text>
  </g>
</svg>
