    </text>

    <!-- Tech Badges -->
    <g transform="translate(18, 102)" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">
      <rect x="0" y="0" width="55" height="18" rx="4" fill="#7928ca" fill-opacity="0.2"/>
      <text x="27.5" y="13" text-anchor="middle" fill="#c084fc">MERN</text>

      <rect x="62" y="0" width="55" height="18" rx="4" fill="#00f2fe" fill-opacity="0.15"/>
      <text x="89.5" y="13" text-anchor="middle" fill="#7dd3fc">REACT</text>

      <rect x="124" y="0" width="45" height="18" rx="4" fill="#ff007f" fill-opacity="0.15"/>
      <text x="146.5" y="13" text-anchor="middle" fill="#f472b6">VITE</text>

      <rect x="176" y="0" width="60" height="18" rx="4" fill="#7928ca" fill-opacity="0.2"/>
      <text x="206" y="13" text-anchor="middle" fill="#c084fc">AWS S3</text>
    </g>
