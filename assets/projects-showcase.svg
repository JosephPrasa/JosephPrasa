    <text x="320" y="26" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="1">MISSION CRITICAL</text>

    <!-- Subtitle -->
    <text x="18" y="48" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Intelligent Community Safety &amp; Emergency Alert Network</text>
    
