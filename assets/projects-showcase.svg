      <rect x="0" y="0" width="62" height="18" rx="4" fill="#00f2fe" fill-opacity="0.15"/>
      <text x="31" y="13" text-anchor="middle" fill="#7dd3fc">FLUTTER</text>

      <rect x="69" y="0" width="65" height="18" rx="4" fill="#7928ca" fill-opacity="0.2"/>
      <text x="101.5" y="13" text-anchor="middle" fill="#c084fc">EXPRESS</text>

      <rect x="141" y="0" width="60" height="18" rx="4" fill="#ff007f" fill-opacity="0.15"/>
      <text x="171" y="13" text-anchor="middle" fill="#f472b6">NODE.JS</text>

      <rect x="208" y="0" width="55" height="18" rx="4" fill="#00f2fe" fill-opacity="0.15"/>
      <text x="235.5" y="13" text-anchor="middle" fill="#7dd3fc">AWS S3</text>
    </g>
  </g>

  <!-- Project 4: ReWear (Bottom Right) -->
  <g transform="translate(490, 225)">
    <rect x="0" y="0" width="444" height="135" rx="12" fill="url(#projGlass)" stroke="#7928ca" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Title & Status -->
    <text x="18" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="800">♻️ ReWear</text>
    <rect x="315" y="12" width="110" height="20" rx="10" fill="#7928ca" fill-opacity="0.2" stroke="#7928ca" stroke-width="0.8"/>
    <circle cx="327" cy="22" r="3" fill="#c084fc"/>
    <text x="335" y="26" fill="#c084fc" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="1">ECO-INITIATIVE</text>

    <!-- Subtitle -->
    <text x="18" y="48" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Sustainable Fashion &amp; Wardrobe Circular Exchange SaaS</text>
    
    <!-- Description -->
    <text x="18" y="68" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400">
