    <rect x="335" y="12" width="90" height="20" rx="10" fill="#ff007f" fill-opacity="0.12" stroke="#ff007f" stroke-width="0.8"/>
    <circle cx="347" cy="22" r="3" fill="#ff007f"/>
    <text x="355" y="26" fill="#ff007f" font-family="'Inter', sans-serif" font-size="9" font-weight="800" letter-spacing="1">DEPLOYED</text>

    <!-- Subtitle -->
    <text x="18" y="48" fill="#ff007f" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Automated Academic Assessment &amp; Code Grading Engine</text>
    
    <!-- Description -->
    <text x="18" y="68" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400">
      Accepts student code submissions, executes isolated test suites,
    </text>
    <text x="18" y="84" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400">
      scores syntax &amp; runtime, and delivers real-time grading analytics.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(18, 102)" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700">
      <rect x="0" y="0" width="60" height="18" rx="4" fill="#ff007f" fill-opacity="0.15"/>
      <text x="30" y="13" text-anchor="middle" fill="#f472b6">PYTHON</text>

      <rect x="67" y="0" width="62" height="18" rx="4" fill="#00f2fe" fill-opacity="0.15"/>
      <text x="98" y="13" text-anchor="middle" fill="#7dd3fc">FASTAPI</text>

      <rect x="136" y="0" width="75" height="18" rx="4" fill="#7928ca" fill-opacity="0.2"/>
      <text x="173.5" y="13" text-anchor="middle" fill="#c084fc">POSTGRES</text>

      <rect x="218" y="0" width="70" height="18" rx="4" fill="#ff007f" fill-opacity="0.15"/>
      <text x="253" y="13" text-anchor="middle" fill="#f472b6">TAILWIND</text>
    </g>
  </g>

  <!-- Project 3: Safe-Haven-System (Bottom Left) -->
  <g transform="translate(26, 225)">
    <rect x="0" y="0" width="444" height="135" rx="12" fill="url(#projGlass)" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Title & Status -->
