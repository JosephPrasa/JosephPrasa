<svg viewBox="0 0 900 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="40%" stop-color="#0b0d1e"/>
      <stop offset="75%" stop-color="#14092b"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>

    <!-- Animated Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dfd8">
        <animate attributeName="stop-color" values="#00dfd8;#7928ca;#ff0080;#00dfd8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#00dfd8;#7928ca;#ff0080" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff0080;#00dfd8;#7928ca" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dfd8">
        <animate attributeName="stop-color" values="#00dfd8;#ff0080;#7928ca;#00dfd8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#7928ca;#00dfd8;#ff0080" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scanning Light Beam -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00dfd8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff0080" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Glowing Orbs -->
    <radialGradient id="orbCyan" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00dfd8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00dfd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbMagenta" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Dot Matrix Pattern -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00dfd8" fill-opacity="0.12"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatName {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes pulsePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    .floating-header {
      animation: floatName 4s ease-in-out infinite;
      transform-origin: center;
    }
    .pulsing-mesh {
      animation: pulsePulse 3.5s ease-in-out infinite;
    }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="896" height="256" rx="20" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="896" height="256" rx="20" fill="url(#dotPattern)"/>

  <!-- Atmospheric Glowing Lights -->
  <rect x="2" y="2" width="896" height="256" rx="20" fill="url(#orbCyan)" class="pulsing-mesh"/>
  <rect x="2" y="2" width="896" height="256" rx="20" fill="url(#orbMagenta)" class="pulsing-mesh"/>
  <rect x="2" y="2" width="896" height="256" rx="20" fill="url(#orbPurple)"/>

  <!-- Glowing Shimmer Border -->
  <rect x="2" y="2" width="896" height="256" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Laser Top Scanning Flare -->
  <line x1="-300" y1="2" x2="0" y2="2" stroke="url(#scanBeam)" stroke-width="3.5">
    <animate attributeName="x1" from="-350" to="900" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="-100" to="1200" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Status Pill at Top -->
  <g transform="translate(300, 24)">
    <rect x="0" y="0" width="300" height="28" rx="14" fill="#00dfd8" fill-opacity="0.09" stroke="#00dfd8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#00dfd8">
      <animate attributeName="r" values="3.5;5;3.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" fill="#00dfd8" font-family="'Inter', -apple-system, Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="2">AI &amp; FULL STACK ENGINEER • ACTIVE</text>
  </g>

  <!-- Hero Name: PRASANTH P -->
  <g class="floating-header">
    <text x="450" y="126" text-anchor="middle" fill="url(#nameGrad)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="7" filter="url(#softGlow)">PRASANTH P</text>
  </g>

  <!-- Modern Subtitle with Glowing Bullets -->
  <g transform="translate(450, 164)" text-anchor="middle" font-family="'Inter', -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3">
    <text x="-215" y="0" fill="#00dfd8">AI ENGINEER</text>
    <text x="-135" y="-1" fill="#ff0080" font-size="10">✦</text>
    <text x="-10" y="0" fill="#ff0080">FULL STACK DEVELOPER</text>
    <text x="120" y="-1" fill="#7928ca" font-size="10">✦</text>
    <text x="225" y="0" fill="#c084fc">BACKEND ARCHITECT</text>
  </g>

  <!-- Capability Badges Row -->
  <g transform="translate(75, 200)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#00dfd8" stroke-width="0.9" stroke-opacity="0.4"/>
      <text x="85" y="18" text-anchor="middle" fill="#7dd3fc" font-family="'Inter', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">AI AGENTS &amp; LLM APPS</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="185" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ff0080" stroke-width="0.9" stroke-opacity="0.4"/>
      <text x="92.5" y="18" text-anchor="middle" fill="#f472b6" font-family="'Inter', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">MERN STACK &amp; FASTAPI</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(395, 0)">
      <rect x="0" y="0" width="175" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#7928ca" stroke-width="0.9" stroke-opacity="0.4"/>
      <text x="87.5" y="18" text-anchor="middle" fill="#c084fc" font-family="'Inter', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">AWS CLOUD &amp; DOCKER</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(590, 0)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#00dfd8" stroke-width="0.9" stroke-opacity="0.4"/>
      <text x="80" y="18" text-anchor="middle" fill="#38bdf8" font-family="'Inter', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1">ECE GRADUATE (B.E.)</text>
    </g>
  </g>
</svg>
