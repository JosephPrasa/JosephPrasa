<svg viewBox="0 0 960 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050611"/>
      <stop offset="50%" stop-color="#090c1e"/>
      <stop offset="100%" stop-color="#140827"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Progress Bars Gradients -->
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="pinkBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#9b51e0"/>
    </linearGradient>
    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cardOrbLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardOrbRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="956" height="356" rx="18" fill="url(#cardBg)"/>
  <rect x="2" y="2" width="956" height="356" rx="18" fill="url(#cardOrbLeft)"/>
  <rect x="2" y="2" width="956" height="356" rx="18" fill="url(#cardOrbRight)"/>

  <!-- Border -->
  <rect x="2" y="2" width="956" height="356" rx="18" fill="none" stroke="url(#cardBorder)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Split Divider Line -->
  <line x1="370" y1="20" x2="370" y2="340" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 4"/>

  <!-- ================= LEFT PANEL: IDENTITY HUD ================= -->
  <g transform="translate(28, 28)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="150" height="24" rx="6" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-width="0.8"/>
    <text x="12" y="16" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">ID: PRASANTH P</text>

    <!-- Name & Title -->
    <text x="0" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="900" letter-spacing="1">PRASANTH P</text>
    <text x="0" y="80" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AI ENGINEER &bull; FULL STACK DEVELOPER</text>
    <text x="0" y="100" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">B.E. Electronics &amp; Communication (ECE)</text>

    <line x1="0" y1="115" x2="315" y2="115" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Neural Proficiency Telemetry -->
    <text x="0" y="138" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">ENGINEERING PROFICIENCY</text>

    <!-- Bar 1: AI & LLMs -->
    <g transform="translate(0, 150)">
      <text x="0" y="12" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">AI Agents &amp; LLM Apps</text>
      <text x="315" y="12" text-anchor="end" fill="#00f2fe" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">95%</text>
      <rect x="0" y="18" width="315" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="0" y="18" width="300" height="6" rx="3" fill="url(#cyanBar)"/>
    </g>

    <!-- Bar 2: MERN Stack -->
    <g transform="translate(0, 184)">
      <text x="0" y="12" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">Full Stack &amp; MERN</text>
      <text x="315" y="12" text-anchor="end" fill="#ff007f" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">96%</text>
      <rect x="0" y="18" width="315" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="0" y="18" width="302" height="6" rx="3" fill="url(#pinkBar)"/>
    </g>

    <!-- Bar 3: Backend & FastAPI -->
    <g transform="translate(0, 218)">
      <text x="0" y="12" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">FastAPI &amp; Backend APIs</text>
      <text x="315" y="12" text-anchor="end" fill="#c084fc" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">92%</text>
      <rect x="0" y="18" width="315" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="0" y="18" width="290" height="6" rx="3" fill="url(#purpleBar)"/>
    </g>

    <!-- Bar 4: Cloud & DevOps -->
    <g transform="translate(0, 252)">
      <text x="0" y="12" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600">AWS Cloud &amp; Docker</text>
      <text x="315" y="12" text-anchor="end" fill="#00f2fe" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">90%</text>
      <rect x="0" y="18" width="315" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="0" y="18" width="283" height="6" rx="3" fill="url(#cyanBar)"/>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: MISSION & CORE PROFILE ================= -->
  <g transform="translate(395, 28)">
    <rect x="0" y="0" width="185" height="24" rx="6" fill="#ff007f" fill-opacity="0.1" stroke="#ff007f" stroke-width="0.8"/>
    <text x="12" y="16" fill="#ff007f" font-family="'Inter', sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">SYSTEM MANIFESTO</text>

    <!-- Item 1: Current Focus -->
    <g transform="translate(0, 42)">
      <circle cx="6" cy="7" r="3" fill="#00f2fe"/>
      <text x="18" y="10" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">CURRENT FOCUS</text>
      <text x="18" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">
        AI Agents, LLM Applications, FastAPI, and Full-Stack MERN Architecture
      </text>
    </g>

    <!-- Item 2: Currently Building -->
    <g transform="translate(0, 92)">
      <circle cx="6" cy="7" r="3" fill="#ff007f"/>
      <text x="18" y="10" fill="#ff007f" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">CURRENTLY BUILDING</text>
      <text x="18" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">
        AI Products &bull; SaaS Applications &bull; High-Concurrency Backend Systems
      </text>
    </g>

    <!-- Item 3: Currently Exploring -->
    <g transform="translate(0, 142)">
      <circle cx="6" cy="7" r="3" fill="#c084fc"/>
      <text x="18" y="10" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">CURRENTLY EXPLORING</text>
      <text x="18" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="500">
        Autonomous Agents (LangChain), LLM Fine-Tuning (LoRA), AWS &amp; Docker
      </text>
    </g>

    <!-- Item 4: Engineering Motto -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="535" height="48" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="16" y="20" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">ENGINEERING MOTTO</text>
      <text x="16" y="38" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-style="italic">
        "Transforming foundational computational logic into autonomous intelligence."
      </text>
    </g>

    <!-- Item 5: Fun Fact -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="535" height="52" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ff007f" stroke-width="0.8" stroke-opacity="0.3"/>
      <text x="16" y="20" fill="#ff007f" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">⚡ UNIQUE FUN FACT</text>
      <text x="16" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">
        Bridging silicon logic gates &amp; signals from ECE up to neural networks &amp; cloud!
      </text>
    </g>
  </g>
</svg>
